# Project information
site_name: AST Metrics documentation
site_author: Jean-François Lépine
site_description: >-
  Open source code analyzer for PHP, Go, Python, Rust, Java, C# and TypeScript.
  On every pull request, ast-metrics review flags only what got worse.
  One binary, no server, no account.
edit_uri: edit/documentation/docs/
site_url: https://ast-metrics.dev/
  
theme:
  name: material
  features:
    - navigation.footer
    - content.action.edit
    - content.code.copy
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.integrate
  palette:
    scheme: default
  logo: assets/images/logo-no-text.png
  favicon: assets/images/logo-no-text.png
  icon:
    repo: fontawesome/brands/github
  custom_dir: docs/overrides

markdown_extensions:
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - md_in_html

plugins:
  - search
  - git-revision-date-localized:
      type: iso_date
      enable_creation_date: false
      fallback_to_build_date: false

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/landing.js

nav:
  - Home: index.md
  - Getting started:
    - Why?: getting-started/index.md
    - Quickstart: getting-started/first-execution.md
    - "Tutorial: your first analysis": getting-started/your-first-analysis.md
    - Installation: getting-started/install.md
    - Reviewing your changes: getting-started/review-changes.md
    - Understanding the output: getting-started/understand.md
    - Generating a report: getting-started/generate-reports.md
    - Advanced usage:
      - Watch mode: advanced-usage/watch-directory.md
      - Compare versions: advanced-usage/compare-versions.md
  - Metrics:
    - metrics/index.md
    - Volume: metrics/volume.md
    - Cyclomatic Complexity: metrics/cyclomatic-complexity.md
    - Maintainability Index: metrics/maintainability-index.md
    - Risk Score: metrics/risk.md
    - Coupling & Instability: metrics/coupling.md
    - Class Cohesion (LCOM4): metrics/lcom4.md
    - Test Quality: metrics/test-quality.md
    - Community Detection: metrics/community-detection.md
    - Architecture Map: metrics/architecture-map.md
    - Bus Factor: metrics/bus-factor.md
  - CI/CD:
    - GitHub Actions: ci/github-actions.md
    - Rulesets & Linting: ci/linting-architecture.md
    - GitLab CI: ci/gitlab-ci.md
    - Tips: ci/tips.md
    - Deploy to a GitHub organization: ci/deploy-github-org.md
  - AI Integration:
    - MCP Server: ai/mcp-server.md


# Repository
repo_name: ast-metrics/ast-metrics
repo_url: https://github.com/ast-metrics/ast-metrics


 
