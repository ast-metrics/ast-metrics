name: release
on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest      # x86_64
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm   # arm64 (public repos)
            goos: linux
            goarch: arm64
          # macOS
          - os: macos-15-intel     # Intel
            goos: darwin
            goarch: amd64
          - os: macos-15           # Apple Silicon
            goos: darwin
            goarch: arm64
          # Windows
          - os: windows-latest     # x86_64
            goos: windows
            goarch: amd64
# DISABLED for the moment:
# gcc_arm64.S: Assembler messages:
# gcc_arm64.S:30: Error: no such instruction: `stp x29,x30,[sp,'
# gcc_arm64.S:34: Error: too many memory references for `mov'
#          - os: windows-11-arm     # arm64 (public repos)
#            goos: windows
#            goarch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-go@v5
        with: { go-version: stable }

      # Toolchains pour CGO
      - name: Toolchain (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config
      - name: Toolchain (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1

      - name: Tests
        run: go test ./...
        env: { CGO_ENABLED: 1 }

      - name: Génère la config ciblée (hors repo)
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/goreleaser.yml" <<EOF
          version: 2
          before:
            hooks:
              - go mod tidy
              - go generate ./...
          builds:
            - id: app
              main: ./cmd/ast-metrics
              env: ["CGO_ENABLED=1"]
              goos: [${{ matrix.goos }}]
              goarch: [${{ matrix.goarch }}]
              ldflags: ["-s", "-w", "-X main.version={{ .Version }}", "-X main.commit={{ .Commit }}", "-X main.date={{ .Date }}"]
              mod_timestamp: "{{ .CommitTimestamp }}"
            - id: cribelo
              binary: cribelo
              main: ./cmd/cribelo
              env: ["CGO_ENABLED=1"]
              goos: [${{ matrix.goos }}]
              goarch: [${{ matrix.goarch }}]
              ldflags: ["-s", "-w", "-X github.com/ast-metrics/ast-metrics/internal/cribelo.Version={{ .Version }}"]
              mod_timestamp: "{{ .CommitTimestamp }}"
          archives:
            - id: bin
              builds: [app]
              format: binary
              name_template: '{{ .ProjectName }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'
            - id: cribelo-bin
              builds: [cribelo]
              format: binary
              name_template: 'cribelo_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'
          changelog:
            sort: asc
            filters:
              exclude:
                - "^docs:"
                - "^test:"
          checksum:
            disable: true
            name_template: "{{ .ProjectName }}_checksums.txt"
            split: true
          
          EOF

      - name: "Fix issue with local files on windows"
        run: |
          # if .ast-metrics.yaml exists in any subfolder of internal folder, rm it
          find . -type f -path "*/internal/*/.ast-metrics.yaml" -exec rm -f {} \;
          # remove also the directory report in any subfolder of internal folder, rm it
          find . -type d -path "*/internal/*/report" -exec rm -rf {} \;
          # reset git state for internal/report directory
          git checkout -- internal/report

        shell: bash
        if: matrix.os == 'windows-latest'

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean --config "${{ runner.temp }}/goreleaser.yml"
        env:
          CGO_ENABLED: 1
          GITHUB_TOKEN: ${{ secrets.PUSH_TOKEN }}

      # The installer and the Action of Cribelo download from the releases of
      # cribelo/cribelo, so the binary built here is mirrored there under the
      # same tag. Every matrix job uploads its own platform; the first one
      # creates the release. PUSH_TOKEN must have write access to that repo.
      - name: Publish cribelo binary to cribelo/cribelo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo cribelo/cribelo >/dev/null 2>&1 \
            || gh release create "$TAG" --repo cribelo/cribelo --title "$TAG" \
                 --notes "Cribelo $TAG, built from https://github.com/ast-metrics/ast-metrics/releases/tag/$TAG" \
            || true
          # goreleaser keeps the binary under dist/cribelo_<os>_<arch>/ and only
          # names it cribelo_Linux_x86_64 at upload time, artifacts.json has both.
          out="$RUNNER_TEMP/cribelo-release"; mkdir -p "$out"
          jq -r '.[] | select(.extra.ID == "cribelo-bin") | [.path, .name] | @tsv' dist/artifacts.json \
            | while IFS=$'\t' read -r path name; do cp "${path//\\//}" "$out/$name"; done
          ls "$out"
          gh release upload "$TAG" --repo cribelo/cribelo --clobber "$out"/*
