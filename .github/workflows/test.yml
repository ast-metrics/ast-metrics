name: CI
permissions:
  contents: read

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        # 1.26 is the minimum go.mod allows, 1.27 is what release binaries are
        # built with: both have to be covered.
        go: ["1.26", "1.27"]

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum

      - name: Display Go version
        run: go version

      - name: Install dependencies
        run: go mod tidy

      - name: Test with the Go CLI (coverage on ubuntu/1.27 only)
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.27'

      - name: Test with the Go CLI (no coverage)
        run: go test -race ./...
        if: matrix.os != 'ubuntu-latest' || matrix.go != '1.27'

      # One report per commit: six would make the Codecov diff unreadable.
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4.0.1
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.27'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ast-metrics/ast-metrics

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup Go (version from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test the cli directly, generating HTML report
        run: |
          mkdir -p build
          go run ./cmd/ast-metrics/ analyze --report-html=reporthtml internal
          ls reporthtml || (echo "No report generated" && exit 1) && (echo "Report generated" && exit 0)

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: "./lighthouserc.json"
          temporaryPublicStorage: true