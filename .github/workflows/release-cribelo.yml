# Releases Cribelo on its own cadence. A tag cribelo-vX.Y.Z builds the cribelo
# binary for every platform and publishes it as release vX.Y.Z of
# github.com/cribelo/cribelo, where the installer and the Action download it.
# The release workflow of ast-metrics ignores these tags, so nothing is
# distributed for ast-metrics itself.
name: release-cribelo
on:
  push:
    tags: ["cribelo-v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: cribelo_Linux_x86_64
          - os: ubuntu-24.04-arm
            asset: cribelo_Linux_arm64
          - os: macos-15-intel
            asset: cribelo_Darwin_x86_64
          - os: macos-14
            asset: cribelo_Darwin_arm64
          - os: windows-latest
            asset: cribelo_Windows_x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-go@v5
        with: { go-version: stable }

      - name: Toolchain (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config
      - name: Toolchain (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1

      - name: Tests
        run: go test ./cmd/cribelo/... ./internal/cribelo/...
        env: { CGO_ENABLED: 1 }

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: 1
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#cribelo-v}"
          mkdir -p out
          go build -trimpath \
            -ldflags "-s -w -X github.com/ast-metrics/ast-metrics/internal/cribelo.Version=${version}" \
            -o "out/$ASSET" ./cmd/cribelo
          "./out/$ASSET" --version

      - name: Publish to cribelo/cribelo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#cribelo-v}"
          tag="v${version}"
          flags=()
          case "$version" in *-*) flags+=(--prerelease) ;; esac
          # Five jobs race to create the release; the losers fall through to the upload.
          gh release view "$tag" --repo cribelo/cribelo >/dev/null 2>&1 \
            || gh release create "$tag" --repo cribelo/cribelo --title "$tag" "${flags[@]}" \
                 --notes "Cribelo ${version}, built from ast-metrics/ast-metrics@${GITHUB_SHA} (tag ${GITHUB_REF_NAME})." \
            || true
          gh release upload "$tag" --repo cribelo/cribelo --clobber "out/$ASSET"
