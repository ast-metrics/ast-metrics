# Post-release distribution: Homebrew tap, Docker image (ghcr.io), .deb/.rpm
# packages, and the language bridges (Composer, npm, PyPI).
# Runs automatically when the "release" workflow succeeds, or manually
# (workflow_dispatch) to replay an existing release.
name: distribute

on:
  workflow_run:
    workflows: ["release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.39.0). Empty = latest release."
        required: false

permissions:
  contents: write
  packages: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          # When triggered by the release workflow, head_branch holds the tag that
          # was pushed: more reliable than the "latest" flag, which GitHub updates
          # with a delay after a release is published.
          if [ -z "$TAG" ] && [ "${{ github.event_name }}" = "workflow_run" ]; then
            TAG="${{ github.event.workflow_run.head_branch }}"
          fi
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  linux-packages:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with: { go-version: stable }

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Download Linux binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${{ needs.resolve.outputs.tag }}" --repo "${{ github.repository }}" \
            --pattern 'ast-metrics_Linux_*' --dir dist

      - name: Build .deb and .rpm
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            case "$arch" in
              amd64) asset="x86_64" ;;
              arm64) asset="arm64" ;;
            esac
            install -m 0755 "dist/ast-metrics_Linux_${asset}" ast-metrics
            cat > nfpm.yaml <<EOF
          name: ast-metrics
          arch: ${arch}
          platform: linux
          version: ${VERSION}
          section: devel
          maintainer: Jean-François Lépine <lepinejeanfrancois@gmail.com>
          description: |
            Multi-language static code analyzer.
            Complexity, volume, coupling and maintainability metrics for Go, PHP, Python, Rust and more.
          vendor: AST Metrics
          homepage: https://ast-metrics.dev
          license: MIT
          contents:
            - src: ./ast-metrics
              dst: /usr/bin/ast-metrics
          EOF
            nfpm package -p deb -f nfpm.yaml -t dist/
            nfpm package -p rpm -f nfpm.yaml -t dist/
          done

      - name: Upload packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.resolve.outputs.tag }}" --repo "${{ github.repository }}" \
            dist/*.deb dist/*.rpm --clobber

  docker:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.resolve.outputs.tag }}
          tags: |
            ghcr.io/ast-metrics/ast-metrics:${{ needs.resolve.outputs.version }}
            ghcr.io/ast-metrics/ast-metrics:latest

  homebrew:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries and compute checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${{ needs.resolve.outputs.tag }}" --repo "${{ github.repository }}" \
            --pattern 'ast-metrics_Darwin_*' --pattern 'ast-metrics_Linux_*' --dir dist
          {
            echo "SHA_DARWIN_ARM64=$(sha256sum dist/ast-metrics_Darwin_arm64 | cut -d' ' -f1)"
            echo "SHA_DARWIN_AMD64=$(sha256sum dist/ast-metrics_Darwin_x86_64 | cut -d' ' -f1)"
            echo "SHA_LINUX_ARM64=$(sha256sum dist/ast-metrics_Linux_arm64 | cut -d' ' -f1)"
            echo "SHA_LINUX_AMD64=$(sha256sum dist/ast-metrics_Linux_x86_64 | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"

      - name: Update formula in ast-metrics/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.PUSH_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/ast-metrics/homebrew-tap.git" tap
          mkdir -p tap/Formula
          BASE="https://github.com/ast-metrics/ast-metrics/releases/download/${TAG}"
          cat > tap/Formula/ast-metrics.rb <<EOF
          class AstMetrics < Formula
            desc "Multi-language code analyzer: complexity, coupling, maintainability"
            homepage "https://ast-metrics.dev"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "${BASE}/ast-metrics_Darwin_arm64"
                sha256 "${SHA_DARWIN_ARM64}"
              end
              on_intel do
                url "${BASE}/ast-metrics_Darwin_x86_64"
                sha256 "${SHA_DARWIN_AMD64}"
              end
            end

            on_linux do
              on_arm do
                url "${BASE}/ast-metrics_Linux_arm64"
                sha256 "${SHA_LINUX_ARM64}"
              end
              on_intel do
                url "${BASE}/ast-metrics_Linux_x86_64"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end

            def install
              bin.install Dir["ast-metrics*"].first => "ast-metrics"
            end

            test do
              system "#{bin}/ast-metrics", "version"
            end
          end
          EOF
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ast-metrics.rb
          git diff --cached --quiet || git commit -m "ast-metrics ${VERSION}"
          git push

  # The PHP bridge (Composer package halleck45/ast-metrics) pins the analyzer
  # version it downloads, so that a locked composer.lock gives a reproducible
  # analysis. That pin has to be moved on every release, and the bridge needs a
  # tag of its own for Packagist to serve it: both are done here, so the two
  # repositories never drift apart.
  php-bridge:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Pin the new version and tag the bridge
        env:
          BRIDGE_TOKEN: ${{ secrets.PUSH_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail

          git clone --quiet \
            "https://x-access-token:${BRIDGE_TOKEN}@github.com/ast-metrics/ast-metrics-bridge-php.git" bridge
          cd bridge

          PINNED="src/Binary/BinaryProvider.php"
          if [ ! -f "$PINNED" ]; then
            echo "::error::$PINNED not found. The bridge layout changed: update this job." >&2
            exit 1
          fi

          # Rewrite the pinned tag, then check the result rather than trusting
          # sed: a silent no-match would publish a bridge that still downloads
          # the previous analyzer.
          sed -i -E "s|(const DEFAULT_VERSION = ')[^']*(';)|\1${TAG}\2|" "$PINNED"
          if ! grep -q "const DEFAULT_VERSION = '${TAG}';" "$PINNED"; then
            echo "::error::Could not pin ${TAG} in $PINNED. The constant was renamed or reformatted." >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on the bridge, nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PINNED"
          git diff --cached --quiet || git commit -m "Pin AST Metrics ${VERSION}"

          # The tag carries the commit that pins the matching analyzer, so
          # installing halleck45/ast-metrics:VERSION gives ast-metrics VERSION.
          git tag -a "${TAG}" -m "AST Metrics ${VERSION}"
          git push origin HEAD:main
          git push origin "refs/tags/${TAG}"

  # Same idea for the npm package (ast-metrics on the registry): it pins the
  # analyzer version it downloads, and its own version number is that same
  # version, so that `npm install ast-metrics@X.Y.Z` is a promise about the
  # analyzer and not just about the wrapper. Two places to rewrite here, then a
  # tag: the bridge publishes to npm from its own workflow.
  js-bridge:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Pin the new version and tag the bridge
        env:
          BRIDGE_TOKEN: ${{ secrets.PUSH_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail

          git clone --quiet \
            "https://x-access-token:${BRIDGE_TOKEN}@github.com/ast-metrics/ast-metrics-bridge-javascript.git" bridge
          cd bridge

          PINNED="lib/version.js"
          if [ ! -f "$PINNED" ] || [ ! -f package.json ]; then
            echo "::error::$PINNED or package.json not found. The bridge layout changed: update this job." >&2
            exit 1
          fi

          # Rewrite the pinned tag, then check the result rather than trusting
          # sed: a silent no-match would publish a bridge that still downloads
          # the previous analyzer.
          sed -i -E "s|(const PINNED_VERSION = ')[^']*(';)|\1${TAG}\2|" "$PINNED"
          if ! grep -q "const PINNED_VERSION = '${TAG}';" "$PINNED"; then
            echo "::error::Could not pin ${TAG} in $PINNED. The constant was renamed or reformatted." >&2
            exit 1
          fi

          # --no-git-tag-version: the tag is created below, on the commit that
          # carries both changes.
          npm version "${VERSION}" --no-git-tag-version --allow-same-version
          if [ "$(node -p "require('./package.json').version")" != "${VERSION}" ]; then
            echo "::error::Could not set the package version to ${VERSION}." >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on the bridge, nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PINNED" package.json
          git diff --cached --quiet || git commit -m "Pin AST Metrics ${VERSION}"

          # The tag triggers the publish workflow of the bridge, which checks
          # that every release asset exists before pushing to npm.
          git tag -a "${TAG}" -m "AST Metrics ${VERSION}"
          git push origin HEAD:main
          git push origin "refs/tags/${TAG}"

  # And the pip package (ast-metrics on PyPI), on the same model as npm: the
  # analyzer version is pinned in the package and is the package version, so
  # that `pip install ast-metrics==X.Y.Z` is a promise about the analyzer. Two
  # places to rewrite, then a tag: the bridge publishes to PyPI from its own
  # workflow.
  python-bridge:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Pin the new version and tag the bridge
        env:
          BRIDGE_TOKEN: ${{ secrets.PUSH_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail

          git clone --quiet \
            "https://x-access-token:${BRIDGE_TOKEN}@github.com/ast-metrics/ast-metrics-bridge-python.git" bridge
          cd bridge

          PINNED="src/ast_metrics/version.py"
          if [ ! -f "$PINNED" ] || [ ! -f pyproject.toml ]; then
            echo "::error::$PINNED or pyproject.toml not found. The bridge layout changed: update this job." >&2
            exit 1
          fi

          # Rewrite the pinned tag, then check the result rather than trusting
          # sed: a silent no-match would publish a bridge that still downloads
          # the previous analyzer.
          sed -i -E "s|^(PINNED_VERSION = \")[^\"]*(\")|\1${TAG}\2|" "$PINNED"
          if ! grep -q "^PINNED_VERSION = \"${TAG}\"" "$PINNED"; then
            echo "::error::Could not pin ${TAG} in $PINNED. The constant was renamed or reformatted." >&2
            exit 1
          fi

          # The package version is written in pyproject.toml, on the only line
          # of the [project] table that starts with `version =`.
          sed -i -E "s|^(version = \")[^\"]*(\")|\1${VERSION}\2|" pyproject.toml
          if ! grep -q "^version = \"${VERSION}\"" pyproject.toml; then
            echo "::error::Could not set the package version to ${VERSION} in pyproject.toml." >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on the bridge, nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PINNED" pyproject.toml
          git diff --cached --quiet || git commit -m "Pin AST Metrics ${VERSION}"

          # The tag triggers the publish workflow of the bridge, which checks
          # that every release asset exists before pushing to PyPI.
          git tag -a "${TAG}" -m "AST Metrics ${VERSION}"
          git push origin HEAD:main
          git push origin "refs/tags/${TAG}"

  # Releases are created as prereleases so that nobody installs them before
  # their assets exist. Once every channel is published, promote the release:
  # drop the prerelease flag and mark it as latest, so that self-update and
  # the releases/latest API serve it. Genuine preversions (v1.2.3-rc1, -beta...)
  # are left untouched.
  finalize:
    needs: [resolve, linux-packages, docker, homebrew, php-bridge, js-bridge, python-bridge]
    runs-on: ubuntu-latest
    steps:
      - name: Promote the release to latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          if echo "$TAG" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
            gh release edit "$TAG" --repo "${{ github.repository }}" --prerelease=false --latest
          else
            echo "Tag $TAG looks like a preversion, leaving it as prerelease."
          fi
